<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; padding: 16px; background: #101018; color: #e8e8ee;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 15px; font-weight: 300; letter-spacing: .1em; color: #d4af37; margin: 0 0 12px; }
    label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
      color: #7a7a88; margin: 10px 0 3px; }
    input { width: 100%; box-sizing: border-box; background: #14141c; color: #e8e8ee;
      border: 1px solid #2a2a36; border-radius: 6px; padding: 7px 9px; font-size: 12px; }
    button { margin-top: 12px; width: 100%; background: #14141c; color: #d4af37;
      border: 1px solid #d4af37; border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
    #out { font-size: 11px; margin-top: 10px; color: #9a9aa6; min-height: 28px; }
    .ok { color: #3ecf8e; } .err { color: #e67a7a; }
    p.note { font-size: 10px; color: #7a7a88; margin: 12px 0 0; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>ACP-VCF PREP PANEL</h1>

  <label for="baseUrl">Backend URL</label>
  <input id="baseUrl" placeholder="http://localhost:8000" />

  <label for="token">JWT token</label>
  <input id="token" type="password" placeholder="paste your ACP-VCF Bearer token" />

  <button id="save">Save & test connection</button>
  <div id="out"></div>

  <p class="note">
    Get the token from ACP-VCF: log in at the app, then copy the JWT
    (DevTools → Application → Local Storage → token). Tokens expire —
    re-paste when the panel reports 401.
  </p>

  <script src="popup.js"></script>
</body>
</html>
