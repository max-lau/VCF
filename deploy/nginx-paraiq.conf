server {
    listen 80;
    server_name _;
    root /root/nlp-portfolio/frontend/dist-vue;
    index index.html;

    # Vue client.js calls — strips /api prefix then proxies to backend
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Direct backend routes (legacy HTML + non-/api/ callers)
    location ~ ^/(auth|email|outlook|analyze|cases|discovery|depositions|motions|contracts|contracts|correspondence|privilege|audit|intake|redaction|risk|feedback|summary|credibility|interrogate|coreference|disambiguate|contradictions|citations|documents|media|messages|model|multilingual|entities|bates|bundle|pacer|timeline|export|exports|reports|calendar|contacts|research|legal-bert|ai-config|enclave|notify|webhook|health|stats|kanban|draft|notifications|brief|approvals|voice|docketing|time|billing|dashboard)/ {
        proxy_pass         http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Vue SPA — everything else goes to index.html
    location /client-portal/view/ {
        try_files $uri $uri/ /index.html;
    }
    location /client-portal/ {
        proxy_pass         http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}
